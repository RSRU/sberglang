[package]
name = "sgl-interrupt"
version = "0.1.0"
edition = "2021"
description = "Context-interruption registry for the SGLang scheduler"
license = "Apache-2.0"

[lib]
name = "sgl_interrupt"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
parking_lot = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1