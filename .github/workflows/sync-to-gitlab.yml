name: Mirror to GitLab

on: [push, delete]

jobs:
  to_gitlab:
    runs-on: ubuntu-latest
    steps:
      # Необходимо для получения полной истории коммитов (fetch-depth: 0)
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Действие, которое зеркалирует репозиторий
      - name: Mirror repository to GitLab
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@git.sberdevices.ru:mlops/sberglang.git
          ssh_private_key:
            # Приватный ключ из секретов
            ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}
